name: Luna Kernel Build

# Merges the latest ACK security release into this OnePlus 13 common
# kernel, integrates the pinned ReSukiSU RC + SUSFS stable snapshot, builds it,
# patches the Image with KPatch-Next, and - only when everything
# succeeds - pushes the merge + integration back to this branch.
# See INTEGRATION_LUNA.md for pins and design notes.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules 2>/dev/null || true
          df -h

      - name: Merge ACK android15-6.6-2026-07_r11 (content-level, latest Google security release)
        run: |
          set -euo pipefail
          ACK_MARKER="scripts/luna-ack-2026-07-r11.applied"
          if [ -f "$ACK_MARKER" ]; then
            echo "ACK android15-6.6-2026-07_r11 already applied; skipping merge"
            grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL) =" Makefile
            exit 0
          fi
          # This tree's git history shares no ancestry with ACK (OnePlus
          # re-imports sources), so a git merge picks a bogus base and
          # reports ~162 false conflicts (run #3). Content-wise the base
          # is exactly ACK 2026-01_r22, so merge file-by-file against it.
          mkdir -p /tmp/ack_r22 /tmp/ack_jul
          curl -sL "https://android.googlesource.com/kernel/common/+archive/refs/tags/android15-6.6-2026-01_r22.tar.gz" | tar xz -C /tmp/ack_r22
          curl -sL "https://android.googlesource.com/kernel/common/+archive/refs/tags/android15-6.6-2026-07_r11.tar.gz" | tar xz -C /tmp/ack_jul
          python3 scripts/luna-ack-merge.py --base /tmp/ack_r22 --theirs /tmp/ack_jul --ours .
          printf '%s\n' 'android15-6.6-2026-07_r11' > "$ACK_MARKER"
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL) =" Makefile

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y flex bison bc libelf-dev libssl-dev \
            dwarves zstd cpio curl git python3 rsync

      - name: Integrate ReSukiSU RC + SUSFS + CVE fix (pinned, idempotent)
        run: |
          set -euo pipefail
          bash scripts/luna-integrate.sh

      - name: Download AOSP clang r510928 (pinned by build.config.constants)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/clang"
          curl -sL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android15-release/clang-r510928.tar.gz" \
            | tar xz -C "$HOME/clang"
          "$HOME/clang/bin/clang" --version | head -n 2
          which pahole && pahole --version

      - name: Configure (gki_defconfig) and verify configs
        run: |
          set -euo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          make ARCH=arm64 LLVM=1 O=out gki_defconfig
          for cfg in CONFIG_KSU=y CONFIG_KSU_SUSFS=y \
                     CONFIG_KSU_SUSFS_SUS_PATH=y CONFIG_KSU_SUSFS_SUS_MOUNT=y \
                     CONFIG_KSU_SUSFS_SUS_KSTAT=y CONFIG_KSU_SUSFS_SPOOF_UNAME=y \
                     CONFIG_KSU_SUSFS_ENABLE_LOG=y CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y \
                     CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y \
                     CONFIG_KSU_SUSFS_OPEN_REDIRECT=y CONFIG_KSU_SUSFS_SUS_MAP=y \
                     CONFIG_DEBUG_INFO_BTF=y CONFIG_KALLSYMS_ALL=y \
                     CONFIG_RCU_NOCB_CPU_DEFAULT_ALL=y; do
            grep -q "^${cfg}$" out/.config && echo "OK  $cfg" || { echo "MISSING $cfg"; exit 1; }
          done
          make --no-print-directory ARCH=arm64 LLVM=1 O=out kernelrelease | tee kernelrelease.txt

      - name: Build kernel Image
        run: |
          set -euo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          make ARCH=arm64 LLVM=1 O=out -j"$(nproc)" Image modules 2>&1 | tee build.log
          test -s out/Module.symvers
          ls -lh out/arch/arm64/boot/Image out/vmlinux out/Module.symvers

      - name: Verify BTF and driver version string
        run: |
          set -euo pipefail
          source scripts/luna-root-stack.env
          export PATH="$HOME/clang/bin:$PATH"
          llvm-readelf -S out/vmlinux | grep -E "\.BTF" || { echo "No .BTF section"; exit 1; }
          VERSION_MATCHES="$(strings out/vmlinux | grep -E "${BAKASU_TAG}-${BAKASU_VERSION_CODE}-[0-9]{8}-luna" || true)"
          [ -n "$VERSION_MATCHES" ] || { echo "ReSukiSU version string not found"; exit 1; }
          printf '%s\n' "$VERSION_MATCHES" | sed -n '1,3p'
          cat kernelrelease.txt

      - name: Apply pinned KPatch-Next to Image
        run: |
          set -euo pipefail
          source scripts/luna-root-stack.env
          cd out/arch/arm64/boot
          BASE_URL="https://github.com/KernelSU-Next/KPatch-Next/releases/download/${KPATCH_NEXT_VERSION}"
          curl -fL -o kptools-linux "${BASE_URL}/kptools-linux"
          curl -fL -o kpimg-linux "${BASE_URL}/kpimg-linux"
          printf '%s  %s\n' \
            "$KPATCH_NEXT_KPTOOLS_SHA256" kptools-linux \
            "$KPATCH_NEXT_KPIMG_SHA256" kpimg-linux | sha256sum -c -
          chmod +x kptools-linux
          ./kptools-linux -p -i Image -k kpimg-linux -o Image.kpn
          ./kptools-linux -l -i Image.kpn | tee kpn-info.txt
          test -s Image.kpn
          test -s kpn-info.txt
          ls -lh Image Image.kpn

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luna-kernel-${{ github.sha }}
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.kpn
            out/arch/arm64/boot/kpn-info.txt
            out/vmlinux
            out/System.map
            out/Module.symvers
            out/.config
            kernelrelease.txt
            build.log
          if-no-files-found: error
          retention-days: 14

      - name: Push merge + integration back to this branch (only after a green build)
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source scripts/luna-root-stack.env
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "feat(luna): integrate ReSukiSU ${BAKASU_TAG} + SUSFS ${SUSFS_VERSION} + KP-N ${KPATCH_NEXT_VERSION}"
          fi
          git push origin HEAD:${{ github.ref_name }}
