name: Luna Kernel Build

# Merges the latest ACK security release into this OnePlus 13 common
# kernel, integrates ReSukiSU (BakaSU) + SUSFS v2.3.0, builds it,
# patches the Image with KPatch-Next, and - only when everything
# succeeds - pushes the merge + integration back to this branch.
# See INTEGRATION_LUNA.md for pins and design notes.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout (full history, needed for the ACK merge)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules 2>/dev/null || true
          df -h

      - name: Merge ACK android15-6.6-2026-07_r11 (latest Google security release)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add ack https://android.googlesource.com/kernel/common
          git fetch ack tag android15-6.6-2026-07_r11
          git merge --no-edit android15-6.6-2026-07_r11 || { echo "MERGE CONFLICT in:"; git diff --name-only --diff-filter=U; exit 1; }
          git log --oneline -3
          grep -E "^(VERSION|PATCHLEVEL|SUBLEVEL) =" Makefile

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison bc libelf-dev libssl-dev \
            dwarves zstd cpio curl git python3 rsync

      - name: Integrate ReSukiSU + SUSFS + CVE fix (pinned, idempotent)
        run: bash scripts/luna-integrate.sh

      - name: Download AOSP clang r510928 (pinned by build.config.constants)
        run: |
          mkdir -p "$HOME/clang"
          curl -sL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android15-release/clang-r510928.tar.gz" \
            | tar xz -C "$HOME/clang"
          "$HOME/clang/bin/clang" --version | head -n 2
          which pahole && pahole --version

      - name: Configure (gki_defconfig) and verify configs
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          make ARCH=arm64 LLVM=1 O=out gki_defconfig
          for cfg in CONFIG_KSU=y CONFIG_KSU_SUSFS=y \
                     CONFIG_DEBUG_INFO_BTF=y CONFIG_KALLSYMS_ALL=y; do
            grep -q "^${cfg}$" out/.config && echo "OK  $cfg" || { echo "MISSING $cfg"; exit 1; }
          done
          make ARCH=arm64 LLVM=1 O=out kernelrelease | tee kernelrelease.txt

      - name: Build kernel Image
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          make ARCH=arm64 LLVM=1 O=out -j"$(nproc)" Image 2>&1 | tee build.log
          ls -lh out/arch/arm64/boot/Image out/vmlinux

      - name: Verify BTF and driver version string
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          llvm-readelf -S out/vmlinux | grep -E "\.BTF" || { echo "No .BTF section"; exit 1; }
          strings out/vmlinux | grep -E "v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-[0-9]{8}-luna" | head -n 3 || true
          cat kernelrelease.txt

      - name: Apply KPatch-Next 0.13.5-2 to Image
        run: |
          cd out/arch/arm64/boot
          curl -sL -O https://github.com/KernelSU-Next/KPatch-Next/releases/download/0.13.5-2/kptools-linux
          curl -sL -O https://github.com/KernelSU-Next/KPatch-Next/releases/download/0.13.5-2/kpimg-linux
          chmod +x kptools-linux
          ./kptools-linux -p -i Image -k kpimg-linux -o Image.kpn
          ./kptools-linux -l -i Image.kpn | head -n 20
          ls -lh Image Image.kpn

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luna-kernel-${{ github.sha }}
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.kpn
            out/vmlinux
            out/System.map
            out/.config
            kernelrelease.txt
            build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Push merge + integration back to this branch (only after a green build)
        if: success()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "feat(luna): integrate ReSukiSU (BakaSU) + SUSFS v2.3.0 + CVE-2026-43499 fix"
          fi
          git push origin HEAD:${{ github.ref_name }}
